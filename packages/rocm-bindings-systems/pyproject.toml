[build-system]
requires = ["scikit-build-core>=0.11.2", "cython>=3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rocm-bindings-systems"
dynamic = ["version"]
description = "ROCm system-level Python bindings (RCCL collective communication, ROCTX tracing)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Advanced Micro Devices, Inc.", email = "hip-python.maintainer@amd.com"},
]
dependencies = [
    "rocm-bindings-core~=7.13.0.0",
    "rocm-bindings-hip~=7.13.0.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/rocm/hip-python"
Documentation = "https://rocm.docs.amd.com/projects/hip-python/en/latest/"
Repository = "https://github.com/rocm/hip-python"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "../build/{wheel_tag}/rocm-bindings-systems"
cmake.source-dir = "."
cmake.build-type = "Release"
ninja.make-fallback = false
wheel.packages = ["src/rocm"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "VERSION"
metadata.version.regex = "(?P<value>.*)"
build.targets = ["package_rocm_bindings_systems"]
install.components = ["rocm-bindings-systems"]

# Include .pxd files for cimport
sdist.include = [
    "VERSION",
    "cmake/HipPythonBuild.cmake",
    "bundled/libhipfile/CMakeLists.txt",
    "src/*/*.pxd",
    "src/*/*/*.pxd",
    "src/*/*.pyx",
    "src/*/*/*.pyx"
]

[tool.cibuildwheel]
build-verbosity = 1
