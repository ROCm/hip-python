[project]
name = "numba-hip"
version = "0.1.3"
description = "Numba HIP - Numba backend for AMD GPUs"
readme = { file = "README.rst", content-type = "text/x-rst" }
authors = [{ name = "Advanced Micro Devices, Inc." }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numba>=0.58,<0.62",
    "hip-python>=6.3.0",
    "hip-python-as-cuda>=6.3.0",
    "rocm-llvm-python>=6.3.0",
]

[project.optional-dependencies]
test = ["pytest", "cffi"]
dev = ["pytest", "cffi"]
rocm-7-1-0 = [
    "hip-python~=7.1.0.0",
    "hip-python-as-cuda~=7.1.0.0",
    "rocm-llvm-python~=7.1.0.0",
]
rocm-7-0-2 = [
    "hip-python~=7.0.2.0",
    "hip-python-as-cuda~=7.0.2.0",
    "rocm-llvm-python~=7.0.2.0",
]
rocm-7-0-1 = [
    "hip-python~=7.0.1.0",
    "hip-python-as-cuda~=7.0.1.0",
    "rocm-llvm-python~=7.0.1.0",
]
rocm-7-0-0 = [
    "hip-python~=7.0.0.0",
    "hip-python-as-cuda~=7.0.0.0",
    "rocm-llvm-python~=7.0.0.0",
]
rocm-6-4-4 = [
    "hip-python~=6.4.4.0",
    "hip-python-as-cuda~=6.4.4.0",
    "rocm-llvm-python~=6.4.4.0",
]
rocm-6-4-3 = [
    "hip-python~=6.4.3.0",
    "hip-python-as-cuda~=6.4.3.0",
    "rocm-llvm-python~=6.4.3.0",
]
rocm-6-4-2 = [
    "hip-python~=6.4.2.0",
    "hip-python-as-cuda~=6.4.2.0",
    "rocm-llvm-python~=6.4.2.0",
]
rocm-6-4-1 = [
    "hip-python~=6.4.1.0",
    "hip-python-as-cuda~=6.4.1.0",
    "rocm-llvm-python~=6.4.1.0",
]
rocm-6-4-0 = [
    "hip-python~=6.4.0.0",
    "hip-python-as-cuda~=6.4.0.0",
    "rocm-llvm-python~=6.4.0.0",
]
rocm-6-3-3 = [
    "hip-python~=6.3.3.0",
    "hip-python-as-cuda~=6.3.3.0",
    "rocm-llvm-python~=6.3.3.0",
]
rocm-6-3-2 = [
    "hip-python~=6.3.2.0",
    "hip-python-as-cuda~=6.3.2.0",
    "rocm-llvm-python~=6.3.2.0",
]
rocm-6-3-1 = [
    "hip-python~=6.3.1.0",
    "hip-python-as-cuda~=6.3.1.0",
    "rocm-llvm-python~=6.3.1.0",
]
rocm-6-3-0 = [
    "hip-python~=6.3.0.0",
    "hip-python-as-cuda~=6.3.0.0",
    "rocm-llvm-python~=6.3.0.0",
]

[project.urls]
Homepage = "https://github.com/rocm/numba-hip"
Documentation = "https://github.com/rocm/numba-hip"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["numba.hip", "numba.hip.*"]
exclude = ["numba.hip.tests"]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | _build
  | build
  | dist
)/
'''
[tool.flake8]
# ignore: E203 whitespace before ':' (conflicts with tool.black)
# ignore: W503 line break before binary operator
ignore = "E203, W503"
