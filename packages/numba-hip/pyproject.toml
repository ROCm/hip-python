[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numba-hip"
version = "0.2.0"
description = "Numba HIP - Numba backend for AMD GPUs"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Advanced Micro Devices, Inc." }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numba>=0.58,<0.62",
    "hip-python-interop>=7.13.0",
    "rocm-bindings-hip>=7.13.0",
    "rocm-bindings-compiler>=7.13.0",
]

[dependency-groups]
test = ["pytest", "cffi"]
dev = ["pytest", "cffi"]

[project.urls]
Homepage = "https://github.com/rocm/hip-python"
Documentation = "https://github.com/rocm/hip-python"

[tool.setuptools.packages.find]
where = ["src"]
include = ["numba.hip", "numba.hip.*"]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | _build
  | build
  | dist
)/
'''
[tool.flake8]
# ignore: E203 whitespace before ':' (conflicts with tool.black)
# ignore: W503 line break before binary operator
ignore = "E203, W503"
