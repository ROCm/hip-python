repos:
- repo: local
  hooks:
        - id: check-license-installation
          name: check-license-installation
          entry: bash -c "type license_verificator >/dev/null 2>&1 || echo \"[WARNING] license verificator not installed!\" || true"
          language: system
          verbose: true
          pass_filenames: false
        - id: amd-copyright
          name: amd-copyright
          entry: bash -c "(! type license_verificator >/dev/null 2>&1) || license_verificator --pre-commit"
          language: system
          pass_filenames: false
- repo: https://github.com/psf/black
  rev: 25.1.0
  hooks:
  - id: black
- repo: https://github.com/pycqa/flake8
  rev: 7.0.0
  hooks:
  - id: flake8
    additional_dependencies: [pyproject-flake8]
- repo: https://github.com/MarcoGorelli/cython-lint
  rev: v0.16.6
  hooks:
  - id: cython-lint
- repo: https://github.com/pycqa/isort
  rev: 6.0.0
  hooks:
  - id: isort
    name: isort (python)
    args: ["--profile", "black"]
  - id: isort
    name: isort (cython)
    types: [ cython ]
    args: ["--profile", "black"]
  - id: isort
    name: isort (pyi)
    types: [ pyi ]
    args: ["--profile", "black"]
