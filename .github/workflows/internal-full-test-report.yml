#
# What a run started from a comment reports back: the check on the commit, and
# the sticky table of one row per configuration under the pull request or issue
# the command was run from.
#
# Called by internal-full-test-hpe.yml and internal-full-test-alola.yml, which
# differ in what a configuration is -- alola picks a card, hpe has one, and a
# command run from an issue names a ref where a pull request has its head -- and
# so in which columns the table has and which fields identify a row. Those are
# inputs; everything else, including the read-modify-write that keeps two
# concurrent runs from losing each other's rows, is the same code for both.
#
# internal-generate-bindings.yml calls it too, for a table whose rows are
# codegen runs rather than tests: same machinery, other columns. That is what
# the row fields below are -- a superset, of which `columns` picks what a
# caller renders -- and why several of them are optional. A codegen row has no
# interpreter; a test row has no branch it pushed to.
#
# One table per site, under its own `marker`, rather than one table for both.
# The size limit is per comment, so a week of alola runs in a shared table would
# push the hpe history out of it, and separate tables let one grow a column the
# other has no use for -- the node a job landed on, say -- without widening both.
#
# The row itself arrives as one input per field rather than as a JSON object: an
# object would have to be assembled by string concatenation in the caller's YAML,
# where a value carrying a quote breaks the payload. `columns` decides which of
# the fields are rendered and in what order, and a field that no column names
# still travels in the payload, which is what lets a site drop a column without
# invalidating the rows already written under its marker.
#
# Each caller grants this `statuses`, `issues` and `pull-requests` write: a
# called workflow cannot widen what it was given.

name: full test (report)

on:
  workflow_call:
    inputs:
      # Identifies the site's sticky comment, and is the first line of it.
      marker:
        description: HTML comment that identifies this site's table
        type: string
        required: true
      heading:
        description: Heading rendered above the table
        type: string
        required: true
      # A JSON array of field names, in the order they are rendered. Known
      # names get a formatting of their own (see `cell` below); anything else
      # renders as its plain value, so a new field costs a caller nothing.
      columns:
        description: JSON array of the row's fields to render, in order
        type: string
        required: true
      # A JSON array of the field names that make two runs the same
      # configuration. A field left out is not part of a configuration's
      # identity: hpe leaves out `arch`, so its rows from before it had a site
      # name -- which carry a `gpu` instead -- still match a run made today.
      key:
        description: JSON array of the row's fields that identify a configuration
        type: string
        required: true
      # The line between the heading and the table. An input because what a
      # stale row means depends on what the table hangs off: a pull request has
      # a head, and an issue tracking a release has a branch per row.
      note:
        description: The sentence under the heading
        type: string
        required: false
        default: >-
          One row per configuration, carrying its latest run. A commit that is
          not the head is a configuration this pull request has not been
          through since.

      # The result being reported.
      result:
        description: Result of the build job, as GitHub spells it
        type: string
        required: true
      sha:
        description: The commit the check is written on
        type: string
        required: true
      # What was asked for, where the commit above is what it resolved to. A
      # pull request run leaves it empty: the head is the only thing it can
      # mean, and a column of one repeated value is not worth its width.
      ref:
        description: The ref the run was asked for. Empty when the head of a pull request was
        type: string
        required: false
        default: ""
      status:
        # Built by the dispatch job and passed through both here and to the
        # pending status, because a context that differed between the two would
        # leave two entries in the checks list instead of updating one.
        description: Status context describing the configuration
        type: string
        required: true
      activity:
        # The check's description reads "<activity> <result>". A codegen run
        # neither builds nor tests, and a check that said it did would be the
        # one line a reader sees on the commit.
        description: What the run did, for the commit status description
        type: string
        required: false
        default: build and test

      # The configuration, one input per field.
      python:
        description: Interpreter the wheels were built with. Empty for a codegen run
        type: string
        required: false
        default: ""
      sabi:
        description: abi3 floor. Empty for a codegen run
        type: string
        required: false
        default: ""
      rocm:
        description: The ROCm specifier that was asked for
        type: string
        required: true
      installed:
        description: The ROCm version the installation reported. Empty when it never got that far
        type: string
        required: false
        default: ""
      sources:
        description: The component sources' ref, when one was named
        type: string
        required: false
        default: ""
      missing:
        description: '"fail" or "skip" for a header this ROCm never shipped'
        type: string
        required: true
      skip:
        description: Libraries left out by name
        type: string
        required: false
        default: ""
      arch:
        description: The card the run asked for. Empty at a site that has one
        type: string
        required: false
        default: ""
      codegen:
        description: '"run" regenerated the bindings, "skip" built the ones the commit carried'
        type: string
        required: false
        default: run

      # A codegen run's own three fields. It has a direction a test does not:
      # from the branch the generator read to the branch its output goes to.
      base:
        description: The branch the bindings were generated from
        type: string
        required: false
        default: ""
      target:
        description: The branch the generated commit goes to
        type: string
        required: false
        default: ""
      pushed:
        description: '"true" when the generated commit was pushed, "false" when it stayed on the runner'
        type: string
        required: false
        default: ""
      dest:
        # Left empty for the usual destination, so that it costs nothing in the
        # flags cell and the rows written before this existed still match a run
        # made today. A caller that fills it in gets a row of its own, which is
        # the point: the same generation aimed at another organization is not
        # the same run.
        description: The organization the commit is pushed to, when it is not the usual one
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  report:
    name: the commit status and the table
    # Self-hosted because the organization's IP allow list rejects a hosted
    # runner's egress address for the API. Unlabelled: this only talks to it.
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    permissions:
      statuses: write
      issues: write
      pull-requests: write
    # One writer at a time per table. A matrix of configurations finishes in
    # clumps, and the read-modify-write below is where two of them lose each
    # other's rows; a group turns that race into a queue. Not cancelling,
    # because the run that would be cancelled is the one carrying a result.
    #
    # The retry below stays as the backstop: this only orders the jobs a group
    # can see, and the two sites' tables live under different markers on the
    # same comment thread.
    concurrency:
      group: full-test-report-${{ inputs.marker }}-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      # An issue_comment run attaches its checks to the default branch, so
      # without this the pull request shows nothing at all. Two reports, which
      # answer different questions: the check says what was run against this
      # commit, the table says what each configuration last did and which commit
      # that was, so a row still pointing at an older commit is the visible
      # reminder that the head has not been through it.
      - name: Report the result on the commit and in the table
        uses: actions/github-script@v9
        env:
          MARKER: ${{ inputs.marker }}
          HEADING: ${{ inputs.heading }}
          NOTE: ${{ inputs.note }}
          COLUMNS: ${{ inputs.columns }}
          KEY: ${{ inputs.key }}
          RESULT: ${{ inputs.result }}
          SHA: ${{ inputs.sha }}
          REF: ${{ inputs.ref }}
          STATUS: ${{ inputs.status }}
          PY: ${{ inputs.python }}
          SABI: ${{ inputs.sabi }}
          ROCM: ${{ inputs.rocm }}
          INSTALLED: ${{ inputs.installed }}
          SOURCES: ${{ inputs.sources }}
          MISSING: ${{ inputs.missing }}
          SKIP: ${{ inputs.skip }}
          ARCH: ${{ inputs.arch }}
          CODEGEN: ${{ inputs.codegen }}
          BASE: ${{ inputs.base }}
          TARGET: ${{ inputs.target }}
          PUSHED: ${{ inputs.pushed }}
          DEST: ${{ inputs.dest }}
          ACTIVITY: ${{ inputs.activity }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const {
              MARKER, HEADING, NOTE, RESULT, SHA, REF, STATUS, PY, SABI, ROCM,
              INSTALLED, SOURCES, MISSING, SKIP, ARCH, CODEGEN, BASE, TARGET,
              PUSHED, DEST, ACTIVITY,
            } = process.env;
            const columns = JSON.parse(process.env.COLUMNS);
            const keyFields = JSON.parse(process.env.KEY);
            const state = { success: 'success', cancelled: 'error' }[RESULT] ?? 'failure';
            const server = `${context.serverUrl}/${owner}/${repo}`;
            const url = `${server}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: SHA,
              state,
              context: STATUS,
              description: `${ACTIVITY} ${RESULT}`,
              target_url: url,
            });

            // One comment per pull request and site, rewritten in place, rather
            // than one per run -- which had a pull request collect a comment for
            // every configuration anybody tried. The rendered table is for
            // reading; the rows are read back out of the payload under it, so
            // nothing has to parse markdown. Editing sends no notification, so a
            // failure now reaches you through its red check rather than the
            // inbox.
            const OPEN = '<!-- full-test-rows';
            const CLOSE = '-->';
            // GitHub rejects a comment body over 65536 characters. What that
            // is in rows depends on the schema the caller asked for and on the
            // payload under the table, which costs about as much again, so the
            // only honest measure is the body that would be posted -- see the
            // trim below. The kilobyte of headroom covers the gap between
            // JavaScript's UTF-16 length and the UTF-8 bytes the API counts,
            // which the emoji in the result column make more than theoretical.
            const BUDGET = 64 * 1024;

            // A row is a configuration, not a run. The commit and the version
            // that was installed are results, so running a configuration again
            // replaces its row wherever the pull request has moved to since --
            // the table states what each configuration last did, and a
            // superseded result survives in the check on the commit it ran
            // against and in its own Actions run.
            //
            // The skipped libraries are part of that identity for the same
            // reason: a run that left one out tested less than one that did
            // not. A row written before a field existed does not carry it,
            // which joins as the empty string and so still matches a run that
            // has nothing there either.
            const key = (r) => keyFields.map((f) => r[f] || '').join('|');
            const row = {
              result: RESULT, sha: SHA, ref: REF || '', python: PY, sabi: SABI, rocm: ROCM,
              installed: INSTALLED || '', sources: SOURCES || '',
              missing: MISSING, skip: SKIP || '', arch: ARCH || '',
              codegen: CODEGEN || 'run',
              base: BASE || '', target: TARGET || '', pushed: PUSHED || '',
              dest: DEST || '',
              run: String(context.runId), at: new Date().toISOString(),
            };

            const rowsOf = (body) => {
              const start = (body || '').indexOf(OPEN);
              if (start < 0) return [];
              const end = body.indexOf(CLOSE, start + OPEN.length);
              if (end < 0) return [];
              try {
                const rows = JSON.parse(body.slice(start + OPEN.length, end));
                // A hand-edited or truncated payload costs the history, not the
                // run: reporting must not be what fails a build. The commit is
                // what every row has and every renderer below needs.
                if (!Array.isArray(rows)) return [];
                return rows.filter((r) => r && r.sha).map((r) => (
                  // Every row written before there was a choice was a codegen
                  // run, and `codegen` is part of a configuration's identity:
                  // read as anything else, such a row would never be replaced
                  // and would sit in the table beside its own successor.
                  { ...r, codegen: r.codegen || 'run' }
                ));
              } catch {
                return [];
              }
            };

            // The columns that are not simply a value: a commit and a run are
            // links, a specifier and a version are code, and `flags` is the
            // several options that are usually unset gathered into one cell so
            // that each does not cost a column of its own.
            const label = { sha: 'commit', at: 'finished' };
            const cell = (r, field) => {
              switch (field) {
                // Emoji is all the colour a table cell can carry: markdown has
                // no span to set one on, and a badge image would send every
                // reader of every table through a service outside the
                // organization. Failure takes the weight as well, because it
                // is the one value a table of results is scanned for, and an
                // unknown state is left as the word rather than given an emoji
                // that would suggest this workflow understood it.
                case 'result':
                  return {
                    success: '✅ success',
                    failure: '❌ **failure**',
                    cancelled: '🚫 cancelled',
                    skipped: '⏭️ skipped',
                  }[r.result] ?? r.result;
                case 'sha':
                  return `[\`${r.sha.slice(0, 7)}\`](${server}/commit/${r.sha})`;
                // What was asked for, linked to what it points at now: a row
                // whose commit is not that is a branch that has moved since.
                // A run pinned to a commit is filed under it, so the link is
                // to the same place the commit column goes.
                case 'ref':
                  return r.ref ? `[\`${r.ref}\`](${server}/tree/${r.ref})` : '—';
                // The two branches a codegen run names, linked the same way as
                // `ref` above. The target may not exist yet -- the first run
                // for a ROCm version is what creates it, and a run that did not
                // push never will -- so the link can point at nothing, which is
                // itself the answer to whether that branch is there.
                case 'base':
                  return r.base ? `[\`${r.base}\`](${server}/tree/${r.base})` : '—';
                case 'target':
                  return r.target ? `[\`${r.target}\`](${server}/tree/${r.target})` : '—';
                // A run that generated without pushing is a preview of what the
                // generator would produce, and reads as one.
                case 'pushed':
                  return { true: 'yes', false: 'no' }[r.pushed] ?? '—';
                case 'rocm':
                  return `\`${r.rocm}\``;
                case 'installed':
                  return r.installed ? `\`${r.installed}\`` : '—';
                case 'run':
                  return `[log](${server}/actions/runs/${r.run})`;
                case 'at':
                  return `${r.at.slice(0, 16).replace('T', ' ')} UTC`;
                case 'flags':
                  return [
                    r.sources ? `sources=\`${r.sources}\`` : '',
                    r.missing === 'skip' ? 'missing=skip' : '',
                    r.skip ? `skip=\`${r.skip}\`` : '',
                    // The one flag that says the wheels were built from the
                    // committed bindings rather than freshly generated ones,
                    // which is a different artifact and so a different row.
                    r.codegen === 'skip' ? 'codegen=skip' : '',
                    // Only a codegen row carries this, and only when it was
                    // aimed somewhere other than the usual organization.
                    r.dest ? `dest=\`${r.dest}\`` : '',
                  ].filter(Boolean).join(', ');
                default:
                  return r[field] ?? '';
              }
            };

            const render = (rows) => [
              MARKER,
              `### ${HEADING}`,
              '',
              NOTE,
              '',
              `| ${columns.map((f) => label[f] || f).join(' | ')} |`,
              `| ${columns.map(() => '---').join(' | ')} |`,
              ...rows.map((r) => `| ${columns.map((f) => cell(r, f)).join(' | ')} |`),
              '',
              OPEN,
              JSON.stringify(rows),
              CLOSE,
            ].join('\n');

            // Runs no longer take turns, so two report jobs can write between
            // each other's read and write. Whoever loses notices that its row
            // is gone and starts again from what the winner left behind.
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: context.issue.number, per_page: 100,
              });
              // The marker identifies the comment, and the author keeps a human
              // who quoted it from being rewritten -- which the API would
              // refuse anyway.
              const [sticky, ...surplus] = comments.filter(
                (c) => c.user?.type === 'Bot' && (c.body || '').startsWith(MARKER));

              // Two jobs that both found none each created one. Keep the older,
              // carry over what the others recorded, and drop them.
              const carried = surplus.flatMap((c) => rowsOf(c.body));
              const kept = [...rowsOf(sticky ? sticky.body : ''), ...carried]
                .filter((r) => key(r) !== key(row));

              // Drop the oldest row until what would be posted fits. The new
              // row is never the one dropped: this run is why the comment is
              // being written. At around 650 characters a row across the table
              // and the payload, that is some hundred configurations before
              // anything falls off, and a configuration that does fall off
              // keeps its check on its commit and its own Actions run.
              let keep = [row, ...kept];
              let body = render(keep);
              while (body.length > BUDGET && keep.length > 1) {
                keep = keep.slice(0, -1);
                body = render(keep);
              }

              const written = sticky
                ? (await github.rest.issues.updateComment({
                  owner, repo, comment_id: sticky.id, body,
                })).data
                : (await github.rest.issues.createComment({
                  owner, repo, issue_number: context.issue.number, body,
                })).data;
              for (const c of surplus) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
              }

              const after = (await github.rest.issues.getComment({
                owner, repo, comment_id: written.id,
              })).data.body;
              if (rowsOf(after).some((r) => key(r) === key(row) && r.run === row.run)) {
                return;
              }
              core.info(`the table was written over on attempt ${attempt}; retrying`);
            }

            // The check on the commit and the run's own step summary still say
            // what happened, which is why this is a warning and not a failure.
            core.warning(`could not record this run in the ${HEADING} table`);
