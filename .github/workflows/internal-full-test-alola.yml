#
# The device-attached half of CI, on demand: the comment path into a full test on
# alola, the SLURM GPU cluster. `/full test alola` on a pull request regenerates
# the bindings, builds every wheel from the freshly generated sources and runs
# the suites in ci/internal/test.sh against them, on a compute node there.
# `codegen=skip` builds the bindings a branch already carries instead, which is
# what a release branch wants and what its own tree is.
#
# The command works on a plain issue too, where `ref=` says what to test in
# place of the head there is not. That is what a release task issue is: one
# comment thread whose table has a row per ref and configuration, so the state
# of amd-integration and of the release branch can be read side by side.
#
# The sibling of internal-full-test-hpe.yml, which does the same on the MI210
# machine we own. Both run the same pipeline from the same scripts in the same
# image, so the options mean the same things; what alola alone has is a choice of
# card, and a wall clock limit for the batch job. Naming the site is what keeps
# the two sites' checks and tables apart.
#
# This file turns a comment into the values that describe a run. The run itself
# lives in internal-full-test-alola-run.yml, which
# internal-full-test-alola-manual.yml calls with the same values from the
# Actions tab, and the reporting in internal-full-test-report.yml, which both
# sites share.
#
# A comment command rather than a `pull_request` trigger because it occupies a
# GPU for the better part of half an hour, which is not something every push
# should do. The corollary is that the pull request's own code is compiled and
# executed on the cluster, so the command is restricted to people who already
# have write access, the job that runs it holds nothing but a read-only token,
# and it holds no secrets at all.
#
# Note that GitHub runs the copy of this file on the default branch, never the
# copy in the pull request being tested. Changes here take effect once merged,
# and cannot be tried out from a pull request.

name: full test (alola)

on:
  issue_comment:
    types: [created]

# No concurrency group, for the reason internal-full-test-hpe.yml gives: with
# several configurations to get through, one command cancelling the run before it
# is the wrong trade, and a group holds one pending slot so a third command would
# cancel the second anyway. Unlike hpe, nothing serializes these either -- the
# cluster has more than one card -- so several alola runs really do proceed at
# once, and each waits only for SLURM.

# Nothing by default. Each job asks for what it needs, and the job that
# executes pull-request code asks only to read it.
permissions: {}

jobs:
  dispatch:
    name: dispatch
    # Authorization comes from the event payload, so an unauthorized comment
    # never reaches a runner. `MEMBER` is any AMD-AIOSS member; narrow this to
    # an explicit list of logins if that is ever too broad.
    #
    # Every comment in the repository starts a run of this workflow, and all but
    # these end here, having allocated nothing.
    #
    # A comment on a plain issue counts too, which is what lets a release task
    # carry its own table: `ref=` says what to test, and the rows collect under
    # the issue rather than under any pull request.
    if: >-
      github.repository_owner == 'AMD-AIOSS'
      && startsWith(github.event.comment.body, '/full test alola')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                  github.event.comment.author_association)
    # Self-hosted because the organization's IP allow list rejects a hosted
    # runner's egress address for the API just as it does for a clone, but
    # unlabelled: this job only talks to the API, and in particular it is not the
    # `alola` label, which belongs to the bridge that submits the batch job.
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    permissions:
      contents: read # expand a short sha
      # The eyes reaction goes on a comment that belongs to a pull request, and
      # GitHub resolves the issues endpoints against the resource's own kind: a
      # token with issues=write but pull-requests=read gets a 403 there. Write
      # here also covers reading the head sha.
      pull-requests: write # react to the triggering comment, resolve the head sha
      issues: write # the same reaction, on a comment to a plain issue
      statuses: write # report "pending" on the commit
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      # What was asked for, which the sha above is the resolution of. Empty on
      # a pull request, where the head is what a run means.
      ref: ${{ steps.parse.outputs.ref }}
      python: ${{ steps.parse.outputs.python }}
      sabi: ${{ steps.parse.outputs.sabi }}
      rocm: ${{ steps.parse.outputs.rocm }}
      sources: ${{ steps.parse.outputs.sources }}
      arch: ${{ steps.parse.outputs.arch }}
      time: ${{ steps.parse.outputs.time }}
      missing: ${{ steps.parse.outputs.missing }}
      skip: ${{ steps.parse.outputs.skip }}
      codegen: ${{ steps.parse.outputs.codegen }}
      # The commit status context, which describes the configuration, so this
      # run's check does not overwrite another configuration's -- including the
      # same configuration's on the other site.
      status: ${{ steps.parse.outputs.status }}
      # The table's shape, decided here because it depends on what the command
      # was run from: a pull request tests one branch, so naming it in every
      # row would be a column of one repeated value, while an issue is where
      # `amd-integration` and a release branch are compared side by side.
      columns: ${{ steps.parse.outputs.columns }}
      key: ${{ steps.parse.outputs.key }}
      note: ${{ steps.parse.outputs.note }}

    steps:
      # /full test alola [ref=<branch|tag>] [arch=mi300x] [time=2h]
      #                  [python=3.10..3.14] [sabi=no|3.11..3.14]
      #                  [rocm=<specifier>] [sources=<ref>] [sha=<7-40 hex>]
      #                  [missing=fail|skip] [skip=<library>[,<library>...]]
      #                  [codegen=run|skip]
      - name: Parse the command
        id: parse
        env:
          # Through the environment, never interpolated into the script body: a
          # comment is untrusted text and ${{ }} inside `run` is an injection.
          BODY: ${{ github.event.comment.body }}
          # Whether the comment is on a pull request. Decides what a command
          # with no `ref=` means, and what shape the table takes.
          IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: |
          # -f because the loop below splits the comment into words, and a body
          # containing `*` would otherwise be expanded against the filesystem.
          set -euf

          # First line only, so a reply that quotes someone else's command
          # cannot smuggle options past the allowlist below.
          line=${BODY%%$'\n'*}
          line=${line%$'\r'}

          # The manylinux image carries every interpreter, so the default is a
          # choice rather than the one that costs no install.
          python=3.12
          sabi=no
          rocm=therock:7.14.0
          sources=
          sha=
          # What to test, when the comment is not on a pull request whose head
          # answers that. A branch or a tag; `sha=` is how to pin a commit.
          ref=
          # The card to allocate. mi300x because it is what the cluster has most
          # of, so it is the one that queues shortest.
          arch=mi300x
          # The SLURM wall clock, which is the profile's own default: a measured
          # run is three minutes of ROCm install, fourteen of codegen and wheels
          # and one of suites, so this is ample rather than tight.
          time=2h
          # A header the requested ROCm never shipped fails the codegen, which
          # is what a test of the current ROCm should do. `skip` is for testing
          # against a release old enough to predate a library.
          missing=fail
          # Libraries to leave out by name, comma-separated. Empty generates
          # every library the selected wheels carry.
          skip=
          # Whether to regenerate the bindings or build the ones the branch
          # already carries. `run` is what makes this a codegen test and is
          # the only thing amd-integration and its pull requests can do, since
          # that is the codegen base branch and carries no rendered bindings.
          # `skip` is for a release branch, where the committed tree is what
          # ships and regenerating it would test something else.
          codegen=run

          for tok in ${line#*/full test alola}; do
            case "${tok}" in
              python=3.1[0-4])
                python=${tok#python=} ;;
              sabi=no|sabi=3.1[1-4])
                sabi=${tok#sabi=} ;;
              missing=fail|missing=skip)
                missing=${tok#missing=} ;;
              codegen=run|codegen=skip)
                codegen=${tok#codegen=} ;;
              # The cards internal-full-test-alola-run.yml can name a ROCm
              # architecture for; keep the two in step. Rejecting an unknown one
              # here rather than passing it on is what turns a name we do not
              # have a gfx target for into an immediate answer -- the cluster
              # would accept, say, an H100 variant quite happily.
              arch=mi300x|arch=mi300a|arch=mi308x|arch=mi325x)
                arch=${tok#arch=} ;;
              arch=mi350x|arch=mi355x)
                arch=${tok#arch=} ;;
              arch=mi210|arch=mi210x|arch=mi250)
                arch=${tok#arch=} ;;
              *)
                # Anchored regexes rather than case globs for these five: two
                # end up in a git ref, one drives an install, and two are
                # validated again by the login node against policy this
                # repository cannot see.
                #
                # The rocm pattern is the ROCM_SPECIFIER grammar of
                # ci/internal/librocm.sh, minus the two forms that need the
                # Jenkins nodes. Repeated here because this job has no
                # checkout to source the library from.
                # The `?` spellings of the three wildcards are here because a
                # comment is rendered markdown: `*a*` is emphasis, so the text
                # a reader sees is not the specifier that ran. They are passed
                # on as typed; librocm.sh rewrites them to the `*` forms.
                if [[ ${tok} =~ ^rocm=(preinstalled|[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?|therock:(\*|\*(a|rc)\*|\?|\?(a|rc)\?|[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}((a|rc)[0-9]{1,8})?))$ ]]; then
                  rocm=${tok#rocm=}
                # The canonical SLURM GRES spelling of a card, which carries the
                # architecture in front of the model and so needs no map at all.
                # The model-name spellings are the case arms above.
                elif [[ ${tok} =~ ^arch=gfx[0-9a-z]{3,5}-[a-z0-9]{2,10}$ ]]; then
                  arch=${tok#arch=}
                # The SLURM wall clock: 2h, 90m, 1h30m or 02:00:00. The profile
                # caps it, and the login node is what enforces that cap.
                elif [[ ${tok} =~ ^time=([0-9]{1,2}h([0-9]{1,2}m)?|[0-9]{1,4}m|[0-9]{1,2}:[0-9]{2}:[0-9]{2})$ ]]; then
                  time=${tok#time=}
                elif [[ ${tok} =~ ^sources=[A-Za-z0-9._/-]{1,100}$ ]]; then
                  sources=${tok#sources=}
                elif [[ ${tok} =~ ^sha=[0-9a-fA-F]{7,40}$ ]]; then
                  sha=${tok#sha=}
                # The same character set as `sources`, and for the same
                # reason: it is a git ref, and the API is asked to resolve it
                # rather than a shell being asked to interpolate it.
                elif [[ ${tok} =~ ^ref=[A-Za-z0-9._/-]{1,100}$ ]]; then
                  ref=${tok#ref=}
                # A comma-separated list, because a space would read as a
                # second option and a semicolon is cmake's list separator,
                # which would not survive the trip to the codegen. The names
                # themselves are not checked here -- this job has no checkout
                # to read AVAILABLE_GENERATORS from -- so an unknown name is
                # the generator's to reject. Repeats accumulate rather than
                # overwrite, unlike the last-wins options above: two skips are
                # a longer list, not a correction.
                elif [[ ${tok} =~ ^skip=[a-z0-9_]+(,[a-z0-9_]+)*$ ]]; then
                  skip=${skip:+${skip},}${tok#skip=}
                elif [[ ${tok} =~ ^arch= ]]; then
                  # Named separately from the catch-all below, because "unknown
                  # option" for a card that exists but has no gfx target here is
                  # not the answer to the question that was asked.
                  echo "::error::unknown arch '${tok#arch=}'; the cards this workflow knows are mi300x mi300a mi308x mi325x mi350x mi355x mi210 mi250, or a gfx<arch>-<model> name"
                  exit 1
                else
                  # Failing beats silently running the default configuration,
                  # which is what a typo would otherwise do.
                  echo "::error::unknown /full test alola option '${tok}'"
                  exit 1
                fi ;;
            esac
          done

          # build-wheels.sh validates the shape of USE_SABI but not its
          # relation to the active interpreter, so an impossible floor would
          # otherwise fail deep inside the build instead of here.
          if [[ ${sabi} != no ]] && (( ${sabi#3.} > ${python#3.} )); then
            echo "::error::sabi=${sabi} exceeds python=${python}; the abi3 floor cannot be newer than the interpreter building the wheels"
            exit 1
          fi

          # The component trees are read by the codegen and by nothing else
          # this run would do, so their ref cannot mean anything here. Saying
          # so beats accepting a request and quietly ignoring half of it.
          # `missing` and `skip` are not in the same position: build-wheels.sh
          # applies both outside its codegen block, because a tree generated
          # with libraries left out is missing their sources whether this run
          # regenerates it or consumes it as it stands.
          if [[ ${codegen} == skip && -n ${sources} ]]; then
            echo "::error::sources=${sources} names the component trees the codegen reads, and codegen=skip does not run one; drop one of the two"
            exit 1
          fi

          # Both name what to test, and the answers can differ. Rather than
          # pick one, say so: `ref=` follows a branch, `sha=` pins a commit.
          if [[ -n ${ref} && -n ${sha} ]]; then
            echo "::error::ref=${ref} and sha=${sha} both say what to test; keep the one you meant -- ref= follows a branch, sha= pins a commit"
            exit 1
          fi

          # On a pull request, no ref means the head, which is what a full test
          # has always meant. On an issue there is no head to mean, and the
          # command has to be told.
          if [[ ${IS_PR} != true && -z ${ref} && -z ${sha} ]]; then
            echo "::error::this comment is on an issue, not a pull request, so there is no head to test; name what to test with ref=<branch> (or sha=<commit>)"
            exit 1
          fi

          # Sorted and de-duplicated, so `skip=a,b`, `skip=b,a` and
          # `skip=b skip=a` are one configuration rather than three checks and
          # three rows in the table. Word-splitting on the commas is safe under
          # the `set -f` above.
          if [[ -n ${skip} ]]; then
            skip=$(printf '%s\n' ${skip//,/ } | sort -u | paste -sd, -)
          fi

          # One check per configuration. The statuses API keys a status by
          # commit and context, so a context shared by every run had each run
          # overwrite the one before it and the checks list showed a single
          # line no matter how many configurations were tried. Built here,
          # once, and reused by the report job: a context that differed
          # between the pending status and the final one would leave two
          # lines instead of updating one.
          #
          # The site is in there because hpe tests the same configurations on
          # its own card, and a context the two shared would have one site's run
          # overwrite the other's check. The wall clock is not: it bounds a run
          # rather than describing one, and a configuration that needed longer
          # is the same configuration.
          #
          # The specifier rather than the version that ends up installed --
          # nothing is installed yet at this point.
          status="full test alola (py${python}, sabi ${sabi}, ${rocm}, ${arch}"
          # An if rather than `[[ ... ]] &&`, which under `set -e` would exit
          # the step the moment the condition did not hold.
          if [[ -n ${sources} ]]; then
            status="${status}, sources ${sources}"
          fi
          if [[ ${missing} == skip ]]; then
            status="${status}, missing skipped"
          fi
          # Part of the configuration, because a run that left a library out
          # tested less than one that did not, and the two should not share a
          # check. A context is plain text, so the commas are safe here.
          if [[ -n ${skip} ]]; then
            status="${status}, skip ${skip}"
          fi
          # A run that built the committed bindings tested a different artifact
          # from one that generated them, so the two want checks of their own.
          if [[ ${codegen} == skip ]]; then
            status="${status}, codegen skipped"
          fi
          status="${status})"

          # What the table looks like, which depends on what the command was
          # run from. A pull request tests its own head and nothing else, so
          # today's schema stands: a ref column would repeat one value down
          # every row. An issue is the other case -- a release task spawns runs
          # against amd-integration and against the release branch -- so the
          # ref becomes a column, and the first field of what makes two runs
          # the same configuration.
          #
          # Emitted from here rather than written into the report call, because
          # only this step knows which event it is.
          if [[ ${IS_PR} == true ]]; then
            columns='["result", "sha", "arch", "python", "sabi", "rocm", "installed", "flags", "run", "at"]'
            key='["arch", "python", "sabi", "rocm", "sources", "missing", "skip", "codegen"]'
            note='One row per configuration, carrying its latest run. A commit that is not the head is a configuration this pull request has not been through since.'
          else
            columns='["result", "ref", "sha", "arch", "python", "sabi", "rocm", "installed", "flags", "run", "at"]'
            key='["ref", "arch", "python", "sabi", "rocm", "sources", "missing", "skip", "codegen"]'
            note='One row per ref and configuration, carrying its latest run. A commit that is not the tip of its ref is a configuration that branch has not been through since.'
          fi

          # What was named, which is what the row is filed under. A pinned
          # commit stands in for a ref it was not given: two runs against two
          # commits of the same branch are two answers about that release
          # task, and a shared empty ref would file them as one.
          named=${ref:-${sha}}

          # The allowlist above is also what keeps a crafted comment from
          # injecting extra keys here: none of these can contain a newline.
          {
            echo "python=${python}"
            echo "sabi=${sabi}"
            echo "rocm=${rocm}"
            echo "sources=${sources}"
            echo "arch=${arch}"
            echo "time=${time}"
            echo "ref=${named}"
            echo "missing=${missing}"
            echo "skip=${skip}"
            echo "codegen=${codegen}"
            echo "status=${status}"
            echo "columns=${columns}"
            echo "key=${key}"
            echo "note=${note}"
          } >>"${GITHUB_OUTPUT}"

      - name: Resolve the commit and acknowledge the command
        id: resolve
        uses: actions/github-script@v9
        env:
          # Whichever of `sha=` and `ref=` was given, already refused as a
          # pair by the parse step: one string for one lookup.
          REQUESTED: ${{ steps.parse.outputs.ref }}
          STATUS: ${{ steps.parse.outputs.status }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const requested = process.env.REQUESTED;
            let sha;
            if (requested) {
              // One call for both spellings: getCommit resolves a branch, a
              // tag or a short sha, and answers with the full forty characters
              // a commit status has to name. Any commit in the repository is
              // accepted, so a sha that belongs to no pull request will report
              // where nobody looks -- hence the reply comment from the report
              // job. Resolved now, so a push between the comment and the build
              // does not change what was tested; `sha=` is how to pin it
              // against the branch moving under a queue.
              sha = (await github.rest.repos.getCommit(
                { owner, repo, ref: requested })).data.sha;
            } else {
              // No ref, so the pull request's head is what was meant. The
              // parse step has already refused this on an issue, where
              // context.issue.number is not a pull request to read.
              sha = (await github.rest.pulls.get(
                { owner, repo, pull_number: context.issue.number })).data.head.sha;
            }
            core.setOutput('sha', sha);

            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: context.payload.comment.id, content: 'eyes',
            });

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'pending',
              context: process.env.STATUS,
              description: 'queued on the alola cluster',
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

      # A parameterized run is not reproducible from the comment thread unless
      # the parameters are written down somewhere.
      - name: Record the resolved parameters
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          REF: ${{ steps.parse.outputs.ref }}
          PY: ${{ steps.parse.outputs.python }}
          SABI: ${{ steps.parse.outputs.sabi }}
          ROCM: ${{ steps.parse.outputs.rocm }}
          SOURCES: ${{ steps.parse.outputs.sources }}
          ARCH: ${{ steps.parse.outputs.arch }}
          TIME: ${{ steps.parse.outputs.time }}
          MISSING: ${{ steps.parse.outputs.missing }}
          SKIP: ${{ steps.parse.outputs.skip }}
          CODEGEN: ${{ steps.parse.outputs.codegen }}
        run: |
          {
            echo "### full test (alola)"
            echo
            if [ -n "${REF}" ]; then
              echo "- ref: \`${REF}\`"
            fi
            echo "- commit: \`${SHA}\`"
            echo "- python: ${PY}"
            echo "- sabi: ${SABI}"
            echo "- gpu: ${ARCH}"
            echo "- rocm: \`${ROCM}\`"
            echo "- codegen: ${CODEGEN}"
            if [ "${CODEGEN}" = skip ]; then
              echo "- component sources: not read; the committed bindings are what is built"
            else
              echo "- component sources: ${SOURCES:-derived from the rocm specifier}"
            fi
            echo "- missing headers: ${MISSING}"
            echo "- skipped libraries: ${SKIP:-none}"
            echo "- wall clock: ${TIME}"
          } >>"${GITHUB_STEP_SUMMARY}"

  # The parsed comment, handed to the shared run. `sha` rather than the pull
  # request's branch, so a push between the comment and the build cannot change
  # what is tested, and no secrets are passed: the job that compiles this code
  # gets the read-only token below and nothing else.
  build-and-test:
    needs: dispatch
    permissions:
      contents: read
    uses: ./.github/workflows/internal-full-test-alola-run.yml
    with:
      ref: ${{ needs.dispatch.outputs.sha }}
      python: ${{ needs.dispatch.outputs.python }}
      sabi: ${{ needs.dispatch.outputs.sabi }}
      rocm: ${{ needs.dispatch.outputs.rocm }}
      sources: ${{ needs.dispatch.outputs.sources }}
      arch: ${{ needs.dispatch.outputs.arch }}
      time: ${{ needs.dispatch.outputs.time }}
      missing: ${{ needs.dispatch.outputs.missing }}
      skip: ${{ needs.dispatch.outputs.skip }}
      codegen: ${{ needs.dispatch.outputs.codegen }}
      # image is left at its default, the manylinux image the wheels ship from.
      # Naming another one is what the manual form is for, on a day quay.io is
      # having a bad one.

  # The check on the commit and this site's table, written by the workflow both
  # sites share. What is site-specific is which comment it writes into and that
  # the card is part of what identifies a configuration here.
  report:
    name: report
    # Runs whatever the build did, but not when the command itself was rejected:
    # a parse error has no commit to report against.
    if: always() && needs.dispatch.result == 'success'
    needs: [dispatch, build-and-test]
    permissions:
      statuses: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/internal-full-test-report.yml
    with:
      marker: <!-- full-test-alola-overview -->
      heading: full test (alola)
      # The shape the dispatch job worked out from the event: a pull request
      # gets the schema it always had, an issue gets a ref column as well.
      columns: ${{ needs.dispatch.outputs.columns }}
      key: ${{ needs.dispatch.outputs.key }}
      note: ${{ needs.dispatch.outputs.note }}
      result: ${{ needs.build-and-test.result }}
      sha: ${{ needs.dispatch.outputs.sha }}
      ref: ${{ needs.dispatch.outputs.ref }}
      status: ${{ needs.dispatch.outputs.status }}
      python: ${{ needs.dispatch.outputs.python }}
      sabi: ${{ needs.dispatch.outputs.sabi }}
      rocm: ${{ needs.dispatch.outputs.rocm }}
      # What the installation on the compute node reported, as against the
      # specifier that asked for it. Empty when the run failed before installing
      # anything.
      installed: ${{ needs.build-and-test.outputs.rocm_version }}
      sources: ${{ needs.dispatch.outputs.sources }}
      arch: ${{ needs.dispatch.outputs.arch }}
      missing: ${{ needs.dispatch.outputs.missing }}
      skip: ${{ needs.dispatch.outputs.skip }}
      codegen: ${{ needs.dispatch.outputs.codegen }}
