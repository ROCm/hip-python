#
# A full test on hpe started from the Actions tab, against any ref. The same run
# as a `/full test hpe` comment produces -- both callers hand the same values to
# internal-full-test-hpe-run.yml -- so this file is only the parameter form and
# the commit status.
#
# When to reach for this rather than the comment: to test a branch that has no
# pull request, to re-run a configuration against an older release branch, or
# to test a pull request head while keeping the noise out of its conversation.
#
# The `ref` input is what gets built, and it is not the same thing as the
# branch chosen in the UI's "Use workflow from" selector. That selector decides
# only which copy of these workflow files runs, and GitHub offers it here at
# all only because this workflow lives on the default branch. Leaving the
# selector on the default branch while pointing `ref` at a release branch is
# the normal case: the newest reporting with any code under test.
#
# No author gate, unlike the comment path: dispatching a workflow already
# requires write access, so the authorization the comment path has to check for
# itself is GitHub's own here.

name: full test (hpe, manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: What to build and test. A branch, tag, sha, or refs/pull/<n>/head
        type: string
        required: true
        default: amd-integration
      python:
        description: Interpreter that builds the wheels
        type: choice
        options: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        default: "3.12"
      # Quoted, all of them: unquoted `no` is a YAML boolean, and this value has
      # to reach build-wheels.sh as the string USE_SABI=no.
      sabi:
        description: abi3 floor. Must not be newer than the interpreter
        type: choice
        options: ["no", "3.11", "3.12", "3.13", "3.14"]
        default: "no"
      # No architecture: this site is one MI210 machine, so a dropdown with one
      # option was a question with one answer. internal-full-test-alola-manual.yml
      # is where an architecture is a choice.
      rocm:
        # The `?` spellings mean the same as the `*` ones; they exist because a
        # `/full test` comment renders `*a*` as emphasis. Named here too so the
        # two entry points describe the same grammar.
        description: "ROCm to install: therock:X.Y.Z, X.Y.Z, therock:* (or ?), therock:*rc* (or ?rc?), therock:*a* (or ?a?) or preinstalled"
        type: string
        default: therock:7.14.0
      sources:
        description: One ref for rocm-systems, rocm-libraries and llvm-project. Empty derives it from the specifier
        type: string
        default: ""
      missing:
        description: A library whose header this ROCm never shipped. Skip it, or fail
        type: choice
        options: [fail, skip]
        default: fail
      skip:
        description: "Libraries not to generate, by name and comma-separated, e.g. hiptensor,hipdnn_backend. Empty generates all of them"
        type: string
        default: ""
      # `skip` needs a ref that carries rendered bindings, which means a release
      # branch: amd-integration is the codegen base and the run rejects it by
      # name. `sources` then names trees nothing reads.
      codegen:
        description: Regenerate the bindings, or build the ones the ref already carries
        type: choice
        options: [run, skip]
        default: run

# Per ref: a second run against the same ref supersedes the first rather than
# queueing behind it on the single runner. A run against a different ref is a
# different thing and waits its turn.
#
# The comment path dropped its group so that testing several configurations in
# a row does not cancel anything, and the same argument applies to two forms
# submitted from the Actions tab. Left as it is here for now, because a
# dispatch is a deliberate single action where re-submitting usually does mean
# "not that, this"; drop it if that turns out to be wrong.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    if: github.repository_owner == 'AMD-AIOSS'
    permissions:
      contents: read
    uses: ./.github/workflows/internal-full-test-hpe-run.yml
    with:
      ref: ${{ inputs.ref }}
      python: ${{ inputs.python }}
      sabi: ${{ inputs.sabi }}
      rocm: ${{ inputs.rocm }}
      sources: ${{ inputs.sources }}
      missing: ${{ inputs.missing }}
      skip: ${{ inputs.skip }}
      codegen: ${{ inputs.codegen }}

  report:
    name: report
    if: always() && github.repository_owner == 'AMD-AIOSS'
    needs: build-and-test
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    permissions:
      statuses: write
      contents: read # resolve the ref when the build did not get that far

    steps:
      # The same status context the comment path writes, on purpose: a manual
      # run against a pull request head then updates the very check a reviewer
      # is already looking at. That is only true while the two agree on how the
      # context is spelled, so the format below mirrors the one the dispatch
      # job of internal-full-test-hpe.yml builds -- a workflow cannot read
      # another workflow's step outputs, which is why it is written twice.
      #
      # There is no comment to leave -- a dispatch has no pull request in
      # context -- so the status and the step summary are the whole report.
      - uses: actions/github-script@v9
        env:
          RESULT: ${{ needs.build-and-test.result }}
          SHA: ${{ needs.build-and-test.outputs.sha }}
          REF: ${{ inputs.ref }}
          PY: ${{ inputs.python }}
          SABI: ${{ inputs.sabi }}
          ROCM: ${{ inputs.rocm }}
          SOURCES: ${{ inputs.sources }}
          MISSING: ${{ inputs.missing }}
          SKIP: ${{ inputs.skip }}
          CODEGEN: ${{ inputs.codegen }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const {
              RESULT, REF, PY, SABI, ROCM, SOURCES, MISSING, SKIP, CODEGEN,
            } = process.env;
            const state = { success: 'success', cancelled: 'error' }[RESULT] ?? 'failure';
            // The faces the table in internal-full-test-report.yml uses, so a
            // result reads the same wherever it is reported.
            const face = {
              success: '✅', failure: '❌', cancelled: '🚫', skipped: '⏭️',
            }[RESULT] ?? '';
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const status = `full test hpe (py${PY}, sabi ${SABI}, ${ROCM}, mi210`
              + (SOURCES ? `, sources ${SOURCES}` : '')
              + (MISSING === 'skip' ? ', missing skipped' : '')
              + (SKIP ? `, skip ${SKIP}` : '')
              + (CODEGEN === 'skip' ? ', codegen skipped' : '') + ')';

            // The run reports what it checked out, which is the commit a status
            // has to name. It is empty only when the build failed before the
            // checkout, and a validation failure is still worth a status, so
            // resolve the ref here in that case.
            const sha = process.env.SHA
              || (await github.rest.repos.getCommit({ owner, repo, ref: REF })).data.sha;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state,
              context: status,
              description: `build and test ${RESULT}`,
              target_url: url,
            });

            // A dispatched run is not reproducible from anywhere else: the
            // parameters exist only in the form that was submitted.
            await core.summary
              .addHeading('full test (hpe, manual)', 3)
              .addList([
                `result: ${face ? `${face} ` : ''}${RESULT}`,
                `ref: ${REF}`,
                `commit: ${sha}`,
                `python: ${PY}`,
                `sabi: ${SABI}`,
                `gpu: mi210`,
                `rocm: ${ROCM}`,
                `codegen: ${CODEGEN}`,
                CODEGEN === 'skip'
                  ? 'component sources: not read; the committed bindings are what is built'
                  : `component sources: ${SOURCES || 'derived from the rocm specifier'}`,
                `missing headers: ${MISSING}`,
                `skipped libraries: ${SKIP || 'none'}`,
              ])
              .write();
