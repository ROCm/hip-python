#
# The work of a release code generation, with no trigger of its own: build the
# generated tree from the ROCm component sources and commit it as a single
# commit, force-pushed onto a release branch when the caller asks for that. The
# GitHub Actions counterpart of the `rocm_python_codegen` node in
# aiss-3p-dev-pipelines, and it drives the same two scripts, so the two stay
# interchangeable.
#
# Called, never dispatched. `workflow_call` does not put a workflow in the
# Actions tab, so the two ways to start one of these are
# internal-generate-bindings.yml (a `/generate bindings` comment) and
# internal-generate-bindings-manual.yml (the Actions tab). Everything either of
# them decides arrives here as an input, which is what lets one job serve both.
#
# Nothing here touches a GPU -- the Jenkins node sets MAP_GPUS: false -- so no
# architecture label is asked for, unlike internal-full-test-hpe-run.yml. What
# it does need is disk and cores, for a ROCm install and three component trees;
# any internal linux runner has both. AMDGPU_TARGETS below only picks which
# ROCm distribution is downloaded.
#
# The container is a stock manylinux image; ci/internal/prepare-container.sh
# installs the ROCm named by the specifier and ci/internal/fetch-rocm-sources.sh
# fetches the component trees the generators read.
#
# Unlike a full test, this run can write to a branch, so `publish` decides
# whether it does. The comment path leaves it off and reports the diffstat; the
# force-push has to be asked for.

name: generate bindings (run)

on:
  workflow_call:
    inputs:
      destination:
        description: Organization whose hip-python the generated commit is pushed to
        type: string
        required: true
      rocm_specifier:
        description: "ROCm to generate against: therock:X.Y.Z, X.Y.Z, therock:*, therock:*rc*, therock:*a* or preinstalled"
        type: string
        required: true
      sources_ref:
        description: One ref for rocm-systems, rocm-libraries and llvm-project. Empty derives it from the specifier
        type: string
        required: false
        default: ""
      base_branch:
        description: Branch to generate from, and whose generator-owned files are restored first
        type: string
        required: false
        default: amd-integration
      target_branch:
        description: Branch to push to. Empty means develop/rocm-rel-<the installed ROCm version>
        type: string
        required: false
        default: ""
      git_author:
        description: Author and committer of the generated commit, "Name <email>"
        type: string
        required: false
        default: Dominic Etienne Charrier <DominicEtienne.Charrier@amd.com>
      allow_missing_headers:
        description: Skip libraries whose headers this ROCm does not ship, instead of failing. For older ROCm
        type: boolean
        required: false
        default: false
      skip_libraries:
        description: Comma-separated libraries not to generate, by name. Empty generates all of them
        type: string
        required: false
        default: ""
      publish:
        description: Push the commit. Left off, the run generates and commits locally
        type: boolean
        required: false
        default: false
      requested_by:
        description: Who asked for this run, when a comment did. Empty for a dispatch
        type: string
        required: false
        default: ""
    outputs:
      sha:
        # The base branch moves, and a caller writing a commit status has to
        # name the commit this run actually generated from.
        description: The commit of the base branch that was generated from
        value: ${{ jobs.generate.outputs.sha }}
      rocm_version:
        # `rocm_specifier` is a specifier, not a version: a wildcard has no
        # version in it at all. This is what the installation reported, and
        # what the target branch below is named after. Empty when the run
        # failed before ROCm was installed.
        description: The ROCm version the installation reported
        value: ${{ jobs.generate.outputs.rocm_version }}
      target:
        description: The branch the commit was pushed to, or would have been
        value: ${{ jobs.generate.outputs.target }}

permissions: {}

jobs:
  generate:
    name: generate for ROCm ${{ inputs.rocm_specifier }} -> ${{ inputs.destination }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    # Two runs would fight over the same working copy on the one runner, and a
    # push interrupted halfway is not something to hand a release branch, so
    # they queue rather than cancel. The group is spelled out rather than built
    # from `github.workflow`, which in a called workflow is the caller's name:
    # a comment and a dispatch have to land in the same queue.
    concurrency:
      group: generate-bindings-${{ inputs.destination }}
      cancel-in-progress: false
    # What makes one file safe for two destinations: define publish-AMD-AIOSS and
    # publish-ROCm, each holding its own PUBLISH_SSH_KEY, and only one key is
    # ever present in a run. Put a required reviewer on publish-ROCm.
    #
    # Named even when `publish` is off, so a missing or wrong key fails in the
    # preflight below rather than after half an hour of generating. The cost is
    # that a reviewer gate, if one is added, also holds up a run that was only
    # ever going to report a diffstat.
    environment: publish-${{ inputs.destination }}
    # All the token does is read the base branch; the push uses the SSH key.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      rocm_version: ${{ steps.target.outputs.version }}
      target: ${{ steps.target.outputs.branch }}
    # ROCm is not in the image; the prepare step below installs the requested
    # one, exactly as the build-and-test job of the full test workflow does.
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      # generate-bindings.sh resolves ${SRC_DIR}/hip_python and the three
      # component trees as its siblings, and writes the generated tree to
      # ${BUILD_DIR}/hip_python for commit-bindings.sh to stage.
      SRC_DIR: ${{ github.workspace }}
      BUILD_DIR: ${{ github.workspace }}/build
      ROCM_PATH: /opt/rocm
      # ROCM_VERSION is deliberately absent: prepare-container.sh reads it back
      # from the installation, which is the only way a wildcard specifier
      # resolves to something the generator can be told.
      ROCM_SPECIFIER: ${{ inputs.rocm_specifier }}
      ROCM_SOURCES_REF: ${{ inputs.sources_ref }}
      # No GPU is used here; this only selects the TheRock artifact group.
      AMDGPU_TARGETS: gfx90a
      MANYLINUX_DEFAULT_PYTHON_VERSION: "3.12"
      HIP_PYTHON_CODEGEN_BASE_BRANCH: ${{ inputs.base_branch }}
      HIP_PYTHON_CODEGEN_GIT_AUTHOR: ${{ inputs.git_author }}
      DESTINATION: ${{ inputs.destination }}
      PUBLISH: ${{ inputs.publish }}

    steps:
      # fetch-depth 0 because generate-bindings.sh restores the generator-owned
      # files from origin/<base_branch> before regenerating, so that the commit
      # contains only what the generator produced. The manylinux image ships
      # git, so there is no tarball fallback to guard against.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}
          path: hip_python
          fetch-depth: 0

      # What `base_branch` resolved to. A branch name moves, and a caller
      # writing a commit status has to name a commit.
      - name: Record the commit generated from
        id: commit
        run: echo "sha=$(git -C hip_python rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      # Also installs rocm-llvm-devel when the specifier is not a TheRock one:
      # the generator needs a clang to ask for its resource dir, and only the
      # TheRock distribution bundles it.
      - name: Install ROCm and select the interpreter
        run: bash hip_python/ci/internal/prepare-container.sh

      - name: Resolve the target branch
        id: target
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -eu
          # ROCM_VERSION comes from the step above, so the branch names the ROCm
          # that was installed rather than the specifier that asked for it.
          branch=${TARGET_BRANCH:-develop/rocm-rel-${ROCM_VERSION}}
          echo "HIP_PYTHON_CODEGEN_BRANCH=${branch}" >>"${GITHUB_ENV}"
          {
            echo "version=${ROCM_VERSION}"
            echo "branch=${branch}"
          } >>"${GITHUB_OUTPUT}"
          if [ "${PUBLISH}" = true ]; then
            echo "publishing to ${DESTINATION}/hip-python ${branch}"
          else
            echo "generating for ${DESTINATION}/hip-python ${branch}, without pushing"
          fi

      # The scripts that run are the base branch's, never the ones next to this
      # workflow on the default branch, so a request the branch's copy does not
      # understand has to be caught before it is silently ignored -- which is
      # the bad outcome here: the run would fail half an hour later for the very
      # reason the request was meant to excuse, or report a tree generated with
      # libraries the request asked to leave out.
      - name: Check that the base branch understands the request
        env:
          ALLOW_MISSING_HEADERS: ${{ inputs.allow_missing_headers }}
          SKIP_LIBRARIES: ${{ inputs.skip_libraries }}
        run: |
          set -eu
          cd hip_python
          # Every step below runs one of these, and a branch that predates them
          # would fail on the first with nothing but a path that does not
          # exist. Worth naming, because the default base is one of those
          # branches until this work is merged there.
          for script in prepare-container.sh fetch-rocm-sources.sh \
                        generate-bindings.sh commit-bindings.sh; do
            if [ ! -f "ci/internal/${script}" ]; then
              echo "::error::${HIP_PYTHON_CODEGEN_BASE_BRANCH} carries no ci/internal/${script}, so it predates the scripts this workflow drives; generate from a branch that has them"
              exit 1
            fi
          done
          if [ "${ALLOW_MISSING_HEADERS}" = "true" ] \
             && ! grep -q HIP_PYTHON_ALLOW_MISSING_HEADERS ci/internal/generate-bindings.sh; then
            echo "::error::${HIP_PYTHON_CODEGEN_BASE_BRANCH} carries a generate-bindings.sh that ignores HIP_PYTHON_ALLOW_MISSING_HEADERS; generate from a branch that has it, or leave allow_missing_headers unset"
            exit 1
          fi
          if [ -n "${SKIP_LIBRARIES}" ] \
             && ! grep -q HIP_PYTHON_SKIP_LIBRARIES ci/internal/generate-bindings.sh; then
            echo "::error::${HIP_PYTHON_CODEGEN_BASE_BRANCH} carries a generate-bindings.sh that ignores HIP_PYTHON_SKIP_LIBRARIES; generate from a branch that has it, or leave skip_libraries empty"
            exit 1
          fi

      # Before spending half an hour generating. A dry run exercises
      # authentication, write permission and any branch protection on the target
      # without touching a ref, so a missing or wrong key fails here.
      #
      # The remote and the key are configured on the checkout rather than on the
      # copy: generate-bindings.sh copies the tree wholesale, .git/config
      # included, so commit-bindings.sh can push from the copy without any of
      # this being repeated there.
      - name: Preflight the destination
        if: inputs.publish
        env:
          PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
        run: |
          set -eu
          if [ -z "${PUBLISH_SSH_KEY}" ]; then
            echo "::error::the publish-${DESTINATION} environment has no PUBLISH_SSH_KEY"
            exit 1
          fi
          umask 077
          key=${RUNNER_TEMP}/publish_key
          hosts=${RUNNER_TEMP}/known_hosts
          printf '%s\n' "${PUBLISH_SSH_KEY}" >"${key}"
          ssh-keyscan -t ed25519 github.com >"${hosts}" 2>/dev/null

          cd hip_python
          # A base_branch whose commit-bindings.sh predates
          # HIP_PYTHON_CODEGEN_REMOTE ignores the variable and pushes to origin,
          # putting the generated bindings in this repository instead of the
          # destination -- and the dry run below would still pass, because it
          # names the remote explicitly. So the mismatch has to be caught by
          # looking at the script.
          if ! grep -q HIP_PYTHON_CODEGEN_REMOTE ci/internal/commit-bindings.sh; then
            echo "::error::${HIP_PYTHON_CODEGEN_BASE_BRANCH} carries a commit-bindings.sh that ignores HIP_PYTHON_CODEGEN_REMOTE; it would push to origin instead of ${DESTINATION}"
            exit 1
          fi

          # Lower-cased, as the Jenkins publish stage does it.
          git remote add dest "git@github.com:${DESTINATION,,}/hip-python.git"
          # IdentitiesOnly so a key from an agent cannot be offered instead.
          git config core.sshCommand \
              "ssh -i ${key} -o IdentitiesOnly=yes -o UserKnownHostsFile=${hosts}"
          git push --dry-run --force dest "HEAD:refs/heads/${HIP_PYTHON_CODEGEN_BRANCH}"

      # After the preflight, so a credential problem does not cost the fetch,
      # and before the generator, which reads these trees. The ref comes from
      # the ROCm specifier unless sources_ref names one.
      - name: Fetch the ROCm component sources
        run: bash hip_python/ci/internal/fetch-rocm-sources.sh

      # Exits with the generator's status while still leaving the most complete
      # partial tree it can, so one failed library fails the run and nothing is
      # pushed -- which is what a release branch wants.
      - name: Generate the bindings
        env:
          HIP_PYTHON_ALLOW_MISSING_HEADERS: ${{ inputs.allow_missing_headers }}
          HIP_PYTHON_SKIP_LIBRARIES: ${{ inputs.skip_libraries }}
        run: bash hip_python/ci/internal/generate-bindings.sh

      - name: Collect the generator logs and the change list
        if: always()
        run: |
          set -eu
          out=${GITHUB_WORKSPACE}/codegen-report
          rm -rf "${out}"
          mkdir -p "${out}"
          # The generator puts per-library logs in a fresh mkdtemp directory.
          cp -r /tmp/hip_python_codegen_*/. "${out}/" 2>/dev/null || true
          if [ -d "${BUILD_DIR}/hip_python/.git" ]; then
            git -C "${BUILD_DIR}/hip_python" status --porcelain >"${out}/status.txt"
            git -C "${BUILD_DIR}/hip_python" diff --stat >"${out}/diffstat.txt"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # The resolved version, not the specifier: 'therock:7.14.0' contains a
          # colon, which an artifact name may not.
          name: codegen-report-${{ steps.target.outputs.version }}-${{ inputs.destination }}
          path: codegen-report
          if-no-files-found: ignore

      # Commits either way. Without `publish` the commit stays on the runner and
      # the summary below is the whole result, which is what makes a comment run
      # a way to see what the generator would produce.
      - name: Commit and publish
        env:
          HIP_PYTHON_CODEGEN_PUSH: ${{ inputs.publish }}
          HIP_PYTHON_CODEGEN_REMOTE: dest
        run: bash "${BUILD_DIR}/hip_python/ci/internal/commit-bindings.sh"

      - name: Summarize the commit
        env:
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          set -eu
          {
            echo "### generated for ROCm ${ROCM_VERSION}"
            echo
            if [ -n "${REQUESTED_BY}" ]; then
              echo "- requested by: @${REQUESTED_BY}"
            fi
            echo "- specifier: \`${ROCM_SPECIFIER}\`"
            echo "- base: \`${HIP_PYTHON_CODEGEN_BASE_BRANCH}\`"
            echo "- destination: ${DESTINATION}/hip-python"
            echo "- branch: ${HIP_PYTHON_CODEGEN_BRANCH}"
            if [ "${PUBLISH}" = true ]; then
              echo "- pushed: yes"
            else
              echo "- pushed: no; the commit exists only on the runner"
            fi
            # Written by the generator when it forgave a missing header, and
            # collected into the report above. Worth naming here: the commit
            # that was just made carries bindings for fewer libraries than
            # the branch it came from.
            skipped=${GITHUB_WORKSPACE}/codegen-report/skipped.txt
            if [ -s "${skipped}" ]; then
              echo "- skipped (no header in this ROCm):"
              while IFS= read -r line; do
                echo "  - \`${line%%:*}\`"
              done <"${skipped}"
            fi
            echo
            echo '```'
            git -C "${BUILD_DIR}/hip_python" show --stat --oneline HEAD | head -n 40
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

      # The key lives in RUNNER_TEMP rather than ~/.ssh because a container job's
      # home directory is a mount that outlives the container on a self-hosted
      # runner. Removed either way.
      - name: Remove the key
        if: always()
        run: rm -f "${RUNNER_TEMP}/publish_key"
