#
# The device-attached half of CI, on demand: the comment path into a full test.
# `/full test` on a pull request regenerates the bindings, builds every wheel
# from the freshly generated sources and runs the suites in ci/internal/test.sh
# against them, on our own hardware.
#
# This file turns a comment into the eight values that describe a run, and
# reports the outcome back to the pull request. The run itself lives in
# internal-full-test-run.yml, which internal-full-test-manual.yml calls with
# the same eight values from the Actions tab.
#
# A comment command rather than a `pull_request` trigger because it occupies
# the one machine with a GPU for hours, which is not something every push
# should do. The corollary is that the pull request's own code is compiled and
# executed on that machine, so the command is restricted to people who already
# have write access, the job that runs it holds nothing but a read-only token,
# and it holds no secrets at all.
#
# Note that GitHub runs the copy of this file on the default branch, never the
# copy in the pull request being tested. Changes here take effect once merged,
# and cannot be tried out from a pull request.

name: full test

on:
  issue_comment:
    types: [created]

# No concurrency group. The single GPU machine already serializes the runs --
# a second one waits for a free runner rather than running beside the first --
# so all a group would add is cancellation, and with several configurations to
# get through, one command killing the run before it is the wrong trade.
# `cancel-in-progress: false` would not do either: a group holds one pending
# slot, so a third command would still cancel the second. Nothing is cancelled
# now except by hand from the Actions tab, and the cost is that a run made
# pointless by a later push stays queued until someone does that.

# Nothing by default. Each job asks for what it needs, and the job that
# executes pull-request code asks only to read it.
permissions: {}

jobs:
  dispatch:
    name: dispatch
    # Authorization comes from the event payload, so an unauthorized comment
    # never reaches a runner. `MEMBER` is any AMD-AIOSS member; narrow this to
    # an explicit list of logins if that is ever too broad.
    #
    # Every comment in the repository starts a run of this workflow, and all but
    # these end here, having allocated nothing.
    if: >-
      github.repository_owner == 'AMD-AIOSS'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/full test')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                  github.event.comment.author_association)
    # Self-hosted because the organization's IP allow list rejects a hosted
    # runner's egress address for the API just as it does for a clone, but
    # unlabelled: this job only talks to the API.
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    permissions:
      contents: read # expand a short sha
      # The eyes reaction goes on a comment that belongs to a pull request, and
      # GitHub resolves the issues endpoints against the resource's own kind: a
      # token with issues=write but pull-requests=read gets a 403 there. Write
      # here also covers reading the head sha.
      pull-requests: write # react to the triggering comment, resolve the head sha
      issues: write # the same reaction, were the command ever run on an issue
      statuses: write # report "pending" on the commit
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      python: ${{ steps.parse.outputs.python }}
      sabi: ${{ steps.parse.outputs.sabi }}
      rocm: ${{ steps.parse.outputs.rocm }}
      sources: ${{ steps.parse.outputs.sources }}
      gpu: ${{ steps.parse.outputs.gpu }}
      missing: ${{ steps.parse.outputs.missing }}
      skip: ${{ steps.parse.outputs.skip }}
      # The commit status context, which describes the configuration, so this
      # run's check does not overwrite another configuration's.
      status: ${{ steps.parse.outputs.status }}

    steps:
      # /full test [python=3.10..3.14] [sabi=no|3.11..3.14] [gpu=gfx<arch>]
      #            [rocm=<specifier>] [sources=<ref>] [sha=<7-40 hex>]
      #            [missing=fail|skip] [skip=<library>[,<library>...]]
      - name: Parse the command
        id: parse
        env:
          # Through the environment, never interpolated into the script body: a
          # comment is untrusted text and ${{ }} inside `run` is an injection.
          BODY: ${{ github.event.comment.body }}
        run: |
          # -f because the loop below splits the comment into words, and a body
          # containing `*` would otherwise be expanded against the filesystem.
          set -euf

          # First line only, so a reply that quotes someone else's command
          # cannot smuggle options past the allowlist below.
          line=${BODY%%$'\n'*}
          line=${line%$'\r'}

          # The manylinux image carries every interpreter, so the default is a
          # choice rather than the one that costs no install.
          python=3.12
          sabi=no
          rocm=therock:7.14.0
          sources=
          sha=
          # Both the runner label and the ROCm distribution that gets installed,
          # so the machine and the build cannot disagree about the architecture.
          gpu=gfx90a
          # A header the requested ROCm never shipped fails the codegen, which
          # is what a test of the current ROCm should do. `skip` is for testing
          # against a release old enough to predate a library.
          missing=fail
          # Libraries to leave out by name, comma-separated. Empty generates
          # every library the selected wheels carry.
          skip=

          for tok in ${line#*/full test}; do
            case "${tok}" in
              python=3.1[0-4])
                python=${tok#python=} ;;
              sabi=no|sabi=3.1[1-4])
                sabi=${tok#sabi=} ;;
              missing=fail|missing=skip)
                missing=${tok#missing=} ;;
              *)
                # Anchored regexes rather than case globs for these four: two
                # end up in a git ref, one drives an install, one becomes a
                # runner label.
                #
                # The rocm pattern is the ROCM_SPECIFIER grammar of
                # ci/internal/librocm.sh, minus the two forms that need the
                # Jenkins nodes. Repeated here because this job has no
                # checkout to source the library from.
                # The `?` spellings of the three wildcards are here because a
                # comment is rendered markdown: `*a*` is emphasis, so the text
                # a reader sees is not the specifier that ran. They are passed
                # on as typed; librocm.sh rewrites them to the `*` forms.
                if [[ ${tok} =~ ^rocm=(preinstalled|[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?|therock:(\*|\*(a|rc)\*|\?|\?(a|rc)\?|[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}((a|rc)[0-9]{1,8})?))$ ]]; then
                  rocm=${tok#rocm=}
                # Only an architecture name, never an arbitrary label: this one
                # decides which machine the job is handed to, and the artifact
                # groups librocm.sh also accepts (gfx90X-dcgpu) are not labels.
                elif [[ ${tok} =~ ^gpu=gfx[0-9]{2,4}[a-z]?$ ]]; then
                  gpu=${tok#gpu=}
                elif [[ ${tok} =~ ^sources=[A-Za-z0-9._/-]{1,100}$ ]]; then
                  sources=${tok#sources=}
                elif [[ ${tok} =~ ^sha=[0-9a-fA-F]{7,40}$ ]]; then
                  sha=${tok#sha=}
                # A comma-separated list, because a space would read as a
                # second option and a semicolon is cmake's list separator,
                # which would not survive the trip to the codegen. The names
                # themselves are not checked here -- this job has no checkout
                # to read AVAILABLE_GENERATORS from -- so an unknown name is
                # the generator's to reject. Repeats accumulate rather than
                # overwrite, unlike the last-wins options above: two skips are
                # a longer list, not a correction.
                elif [[ ${tok} =~ ^skip=[a-z0-9_]+(,[a-z0-9_]+)*$ ]]; then
                  skip=${skip:+${skip},}${tok#skip=}
                else
                  # Failing beats silently running the default configuration,
                  # which is what a typo would otherwise do.
                  echo "::error::unknown /full test option '${tok}'"
                  exit 1
                fi ;;
            esac
          done

          # build-wheels.sh validates the shape of USE_SABI but not its
          # relation to the active interpreter, so an impossible floor would
          # otherwise fail deep inside the build instead of here.
          if [[ ${sabi} != no ]] && (( ${sabi#3.} > ${python#3.} )); then
            echo "::error::sabi=${sabi} exceeds python=${python}; the abi3 floor cannot be newer than the interpreter building the wheels"
            exit 1
          fi

          # Sorted and de-duplicated, so `skip=a,b`, `skip=b,a` and
          # `skip=b skip=a` are one configuration rather than three checks and
          # three rows in the table. Word-splitting on the commas is safe under
          # the `set -f` above.
          if [[ -n ${skip} ]]; then
            skip=$(printf '%s\n' ${skip//,/ } | sort -u | paste -sd, -)
          fi

          # One check per configuration. The statuses API keys a status by
          # commit and context, so a context shared by every run had each run
          # overwrite the one before it and the checks list showed a single
          # line no matter how many configurations were tried. Built here,
          # once, and reused by the report job: a context that differed
          # between the pending status and the final one would leave two
          # lines instead of updating one.
          #
          # The specifier rather than the version that ends up installed --
          # nothing is installed yet at this point.
          status="full test (py${python}, sabi ${sabi}, ${rocm}, ${gpu}"
          # An if rather than `[[ ... ]] &&`, which under `set -e` would exit
          # the step the moment the condition did not hold.
          if [[ -n ${sources} ]]; then
            status="${status}, sources ${sources}"
          fi
          if [[ ${missing} == skip ]]; then
            status="${status}, missing skipped"
          fi
          # Part of the configuration, because a run that left a library out
          # tested less than one that did not, and the two should not share a
          # check. A context is plain text, so the commas are safe here.
          if [[ -n ${skip} ]]; then
            status="${status}, skip ${skip}"
          fi
          status="${status})"

          # The allowlist above is also what keeps a crafted comment from
          # injecting extra keys here: none of these can contain a newline.
          {
            echo "python=${python}"
            echo "sabi=${sabi}"
            echo "rocm=${rocm}"
            echo "sources=${sources}"
            echo "gpu=${gpu}"
            echo "sha=${sha}"
            echo "missing=${missing}"
            echo "skip=${skip}"
            echo "status=${status}"
          } >>"${GITHUB_OUTPUT}"

      - name: Resolve the commit and acknowledge the command
        id: resolve
        uses: actions/github-script@v9
        env:
          REQUESTED_SHA: ${{ steps.parse.outputs.sha }}
          STATUS: ${{ steps.parse.outputs.status }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const requested = process.env.REQUESTED_SHA;
            let sha;
            if (requested) {
              // Expand it: a commit status names the full forty characters.
              // Any commit in the repository is accepted, so a sha that is not
              // part of this pull request will report where nobody looks --
              // hence the reply comment from the report job.
              sha = (await github.rest.repos.getCommit(
                { owner, repo, ref: requested })).data.sha;
            } else {
              // Resolved now, so a push between the comment and the build is
              // what gets built. `sha=` is how to pin it.
              sha = (await github.rest.pulls.get(
                { owner, repo, pull_number: context.issue.number })).data.head.sha;
            }
            core.setOutput('sha', sha);

            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: context.payload.comment.id, content: 'eyes',
            });

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'pending',
              context: process.env.STATUS,
              description: 'queued on the internal runner',
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

      # A parameterized run is not reproducible from the pull request unless the
      # parameters are written down somewhere.
      - name: Record the resolved parameters
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          PY: ${{ steps.parse.outputs.python }}
          SABI: ${{ steps.parse.outputs.sabi }}
          ROCM: ${{ steps.parse.outputs.rocm }}
          SOURCES: ${{ steps.parse.outputs.sources }}
          GPU: ${{ steps.parse.outputs.gpu }}
          MISSING: ${{ steps.parse.outputs.missing }}
          SKIP: ${{ steps.parse.outputs.skip }}
        run: |
          {
            echo "### full test"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- python: ${PY}"
            echo "- sabi: ${SABI}"
            echo "- gpu: ${GPU}"
            echo "- rocm: \`${ROCM}\`"
            echo "- component sources: ${SOURCES:-derived from the rocm specifier}"
            echo "- missing headers: ${MISSING}"
            echo "- skipped libraries: ${SKIP:-none}"
          } >>"${GITHUB_STEP_SUMMARY}"

  # The parsed comment, handed to the shared run. `sha` rather than the pull
  # request's branch, so a push between the comment and the build cannot change
  # what is tested, and no secrets are passed: the job that compiles this code
  # gets the read-only token below and nothing else.
  build-and-test:
    needs: dispatch
    permissions:
      contents: read
    uses: ./.github/workflows/internal-full-test-run.yml
    with:
      ref: ${{ needs.dispatch.outputs.sha }}
      python: ${{ needs.dispatch.outputs.python }}
      sabi: ${{ needs.dispatch.outputs.sabi }}
      rocm: ${{ needs.dispatch.outputs.rocm }}
      sources: ${{ needs.dispatch.outputs.sources }}
      gpu: ${{ needs.dispatch.outputs.gpu }}
      missing: ${{ needs.dispatch.outputs.missing }}
      skip: ${{ needs.dispatch.outputs.skip }}

  report:
    name: report
    # Runs whatever the build did, but not when the command itself was rejected:
    # a parse error has no commit to report against.
    if: always() && needs.dispatch.result == 'success'
    needs: [dispatch, build-and-test]
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    permissions:
      statuses: write
      issues: write
      pull-requests: write

    steps:
      # An issue_comment run attaches its checks to the default branch, so
      # without this the pull request shows nothing at all. Two reports, which
      # answer different questions: the check says what was run against this
      # commit, the table says what each configuration last did and which commit
      # that was, so a row still pointing at an older commit is the visible
      # reminder that the head has not been through it.
      - name: Report the result on the commit and in the table
        uses: actions/github-script@v9
        env:
          RESULT: ${{ needs.build-and-test.result }}
          SHA: ${{ needs.dispatch.outputs.sha }}
          # Rather than rebuilt here, so the pending line and this one cannot
          # disagree and end up as two entries in the checks list.
          STATUS: ${{ needs.dispatch.outputs.status }}
          PY: ${{ needs.dispatch.outputs.python }}
          SABI: ${{ needs.dispatch.outputs.sabi }}
          ROCM: ${{ needs.dispatch.outputs.rocm }}
          # What the installation reported, as against the ROCM specifier that
          # asked for it. Empty when the run failed before installing anything.
          INSTALLED: ${{ needs.build-and-test.outputs.rocm_version }}
          SOURCES: ${{ needs.dispatch.outputs.sources }}
          GPU: ${{ needs.dispatch.outputs.gpu }}
          MISSING: ${{ needs.dispatch.outputs.missing }}
          SKIP: ${{ needs.dispatch.outputs.skip }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const {
              RESULT, SHA, STATUS, PY, SABI, ROCM, INSTALLED, SOURCES, GPU,
              MISSING, SKIP,
            } = process.env;
            const state = { success: 'success', cancelled: 'error' }[RESULT] ?? 'failure';
            const server = `${context.serverUrl}/${owner}/${repo}`;
            const url = `${server}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: SHA,
              state,
              context: STATUS,
              description: `build and test ${RESULT}`,
              target_url: url,
            });

            // One comment per pull request, rewritten in place, rather than one
            // per run -- which had a pull request collect a comment for every
            // configuration anybody tried. The rendered table is for reading;
            // the rows are read back out of the payload under it, so nothing
            // has to parse markdown. Editing sends no notification, so a
            // failure now reaches you through its red check rather than the
            // inbox.
            const MARKER = '<!-- full-test-overview -->';
            const OPEN = '<!-- full-test-rows';
            const CLOSE = '-->';
            // Only to keep a pathological pull request under the 65 kB comment
            // limit: the real bound is how many configurations anyone runs.
            const LIMIT = 25;

            // A row is a configuration, not a run. The commit and the version
            // that was installed are results, so running a configuration again
            // replaces its row wherever the pull request has moved to since --
            // the table states what each configuration last did, and a
            // superseded result survives in the check on the commit it ran
            // against and in its own Actions run.
            //
            // The skipped libraries are part of the configuration for the same
            // reason: a run that left one out tested less than one that did
            // not. A row written before the option existed has no `skip` at
            // all, which joins as the empty string and so still matches a run
            // that skipped nothing.
            const key = (r) =>
              [r.python, r.sabi, r.rocm, r.sources, r.gpu, r.missing, r.skip || '']
                .join('|');
            const row = {
              result: RESULT, sha: SHA, python: PY, sabi: SABI, rocm: ROCM,
              installed: INSTALLED || '', gpu: GPU, sources: SOURCES || '',
              missing: MISSING, skip: SKIP || '', run: String(context.runId),
              at: new Date().toISOString(),
            };

            const rowsOf = (body) => {
              const start = (body || '').indexOf(OPEN);
              if (start < 0) return [];
              const end = body.indexOf(CLOSE, start + OPEN.length);
              if (end < 0) return [];
              try {
                const rows = JSON.parse(body.slice(start + OPEN.length, end));
                // A hand-edited or truncated payload costs the history, not the
                // run: reporting must not be what fails a build.
                return Array.isArray(rows) ? rows.filter((r) => r && r.python) : [];
              } catch {
                return [];
              }
            };

            const render = (rows) => [
              MARKER,
              '### full test',
              '',
              'One row per configuration, carrying its latest run. A commit that is not',
              'the head is a configuration this pull request has not been through since.',
              '',
              '| result | commit | python | sabi | rocm | installed | gpu | flags | run | finished |',
              '| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |',
              ...rows.map((r) => {
                const flags = [
                  r.sources ? `sources=\`${r.sources}\`` : '',
                  r.missing === 'skip' ? 'missing=skip' : '',
                  r.skip ? `skip=\`${r.skip}\`` : '',
                ].filter(Boolean).join(', ');
                return '| ' + [
                  r.result,
                  `[\`${r.sha.slice(0, 7)}\`](${server}/commit/${r.sha})`,
                  r.python,
                  r.sabi,
                  `\`${r.rocm}\``,
                  r.installed ? `\`${r.installed}\`` : '—',
                  r.gpu,
                  flags,
                  `[log](${server}/actions/runs/${r.run})`,
                  `${r.at.slice(0, 16).replace('T', ' ')} UTC`,
                ].join(' | ') + ' |';
              }),
              '',
              OPEN,
              JSON.stringify(rows),
              CLOSE,
            ].join('\n');

            // Runs no longer take turns, so two report jobs can write between
            // each other's read and write. Whoever loses notices that its row
            // is gone and starts again from what the winner left behind.
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: context.issue.number, per_page: 100,
              });
              // The marker identifies the comment, and the author keeps a human
              // who quoted it from being rewritten -- which the API would
              // refuse anyway.
              const [sticky, ...surplus] = comments.filter(
                (c) => c.user?.type === 'Bot' && (c.body || '').startsWith(MARKER));

              // Two jobs that both found none each created one. Keep the older,
              // carry over what the others recorded, and drop them.
              const carried = surplus.flatMap((c) => rowsOf(c.body));
              const kept = [...rowsOf(sticky ? sticky.body : ''), ...carried]
                .filter((r) => key(r) !== key(row));
              const body = render([row, ...kept].slice(0, LIMIT));

              const written = sticky
                ? (await github.rest.issues.updateComment({
                  owner, repo, comment_id: sticky.id, body,
                })).data
                : (await github.rest.issues.createComment({
                  owner, repo, issue_number: context.issue.number, body,
                })).data;
              for (const c of surplus) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
              }

              const after = (await github.rest.issues.getComment({
                owner, repo, comment_id: written.id,
              })).data.body;
              if (rowsOf(after).some((r) => key(r) === key(row) && r.run === row.run)) {
                return;
              }
              core.info(`the table was written over on attempt ${attempt}; retrying`);
            }

            // The check on the commit and the run's own step summary still say
            // what happened, which is why this is a warning and not a failure.
            core.warning('could not record this run in the full test table');
