# zizmor configuration
# Reference: https://docs.zizmor.sh/configuration/
# Local scan: zizmor --config .github/scan_tools_configs/zizmor.yml .
#
# Zizmor configuration for this repository's security scans.
#
# This file defines the complete scanner policy;
# Keep repository-specific suppressions and tuning here.
#
# Zizmor has no ignore file. Suppress a finding with:
#
#   1. An inline comment naming the rule:
#          run: | # zizmor: ignore[template-injection] input is validated
#
#   2. `rules.<rule-id>.ignore` with `<file>[:<line>[:<col>]]`:
#          rules:
#            template-injection:
#              ignore:
#                - safe.yml
#
#   3. `rules.<rule-id>.disable: true` to disable a rule repository-wide.
#
# Add rule-specific settings and suppressions under `rules:`.

rules:
  unpinned-uses:
    config:
      policies:
        # Security owns this workflow and moves the v1 tag.
        ROCm/rocm-security-gh/.github/workflows/security-baseline.yml: ref-pin
    # AMD-AIOSS-only. ROCm has no runners, and hash-pinning the
    # private action would churn on every update.
    # Ignore entries are base filenames; zizmor does not glob them.
    ignore: &internal-workflows
      - internal-alola-probe.yml
      - internal-full-test-alola-manual.yml
      - internal-full-test-alola-run.yml
      - internal-full-test-alola.yml
      - internal-full-test-hpe-manual.yml
      - internal-full-test-hpe-run.yml
      - internal-full-test-hpe.yml
      - internal-full-test-report.yml
      - internal-full-test.yml
      - internal-generate-bindings-manual.yml
      - internal-generate-bindings-run.yml
      - internal-generate-bindings.yml
      - internal-publish-docs.yml
      - internal-publish-wheels-manual.yml
      - internal-publish-wheels-run.yml
      - internal-publish-wheels.yml
      - internal-tooling-tests.yml
  unpinned-images:
    # Same workflows. Digest-pinning the manylinux image churns the same way.
    ignore: *internal-workflows
  dangerous-triggers:
    # issue_comment on those workflows. The owner check stops them on ROCm.
    ignore: *internal-workflows
