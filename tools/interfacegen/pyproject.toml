[project]
name = "interfacegen"
version = "0.1"
description = "InterfaceGen: Generate bindings and whole packages from C header files."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Advanced Micro Devices, Inc." }]
license = { text = "MIT" }
requires-python = ">=3.7"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "cython",
    "pyparsing",
    "libclang >= 14.0.1, != 15.0.3, != 15.0.6, <= 15.0.6.1",
]

[project.optional-dependencies]
dev = ["pytest"]
extra = ["levenshtein"]

[project.urls]
Homepage = "https://github.com/AMD-AI/Interfacegen"
Documentation = "https://github.com/AMD-AI/Interfacegen"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["python"]
# include = []
# exclude = []
