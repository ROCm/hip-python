[project]
name = "interfacegen"
version = "0.1"
description = "InterfaceGen: Generate bindings and whole packages from C header files."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Advanced Micro Devices, Inc." }]
license = { text = "MIT" }
requires-python = ">=3.7"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Floor is 3.1.0: Cython 3.0.x miscompiles `cdef T x = <T>expr`
    # when T contains the `*const *` pattern (silently drops the
    # initializer, leaves the local NULL — see
    # share/design/UPSTREAM_BUGS/test_const_bug.pyx for the bisection).
    # The codegen also defends with the split-form prehoist, so this
    # floor is belt-and-suspenders.
    "cython >= 3.1.0",
    "pyparsing",
#    "libclang >= 14.0.1, != 15.0.3, != 15.0.6, <= 15.0.6.1",
    "libclang>=18,<19"
]

[project.optional-dependencies]
dev = ["pytest"]
extra = ["levenshtein"]

[project.urls]
Homepage = "https://github.com/AMD-AI/Interfacegen"
Documentation = "https://github.com/AMD-AI/Interfacegen"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["python"]
# include = []
# exclude = []

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | _build
  | build
  | dist
)/
'''
