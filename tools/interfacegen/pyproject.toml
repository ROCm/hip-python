[project]
name = "interfacegen"
version = "0.3"
description = "InterfaceGen: Generate bindings and whole packages from C header files."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Advanced Micro Devices, Inc." }]
license = { text = "MIT" }
requires-python = ">=3.7"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "Tempita >= 0.6.0",
    "pyparsing",
#    "libclang >= 14.0.1, != 15.0.3, != 15.0.6, <= 15.0.6.1",
    "libclang>=18,<19"
]

[project.optional-dependencies]
dev = ["pytest"]
extra = ["levenshtein"]

[project.urls]
Homepage = "https://github.com/rocm/hip-python"
Documentation = "https://github.com/rocm/hip-python"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["python"]
# include = []
# exclude = []

[tool.setuptools.package-data]
# The fallback builtin headers are data, so setuptools drops them from the
# wheel unless they are named here; a parse then silently loses size_t.
interfacegen = ["builtin_includes/*.h", "builtin_includes/README.md"]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | _build
  | build
  | dist
)/
'''
